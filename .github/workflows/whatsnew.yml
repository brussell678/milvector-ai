name: Publish What's New

# Publishes new WHATSNEW.md entries to the live feed whenever the file changes on
# main. Also runnable on demand from the Actions tab (Run workflow).
on:
  push:
    branches: [main]
    paths:
      - "WHATSNEW.md"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish updates
        run: node scripts/publish-whatsnew.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
